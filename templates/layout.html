<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Accessibility Comparison</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
          "Segoe UI Symbol";
        background: #f8f9fa;
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      ul,
      li {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      a:link,
      a:visited {
        color: #007acc;
      }
      a:hover {
        color: #0098ff;
      }
      .container {
        margin: 0 auto;
        padding: 2rem 1rem 0 1rem;
        box-sizing: border-box;
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      .audit-meta {
        font-size: 0.8em;
        color: #666;
        padding: 0.3em 0.8em;
        z-index: 2;
        text-align: right;
      }
      .timestamp {
        font-weight: bold;
        display: inline-block;
      }
      .nav-arrows {
        margin-top: 0.4rem;
        display: flex;
        gap: 1rem;
        align-items: center;
        justify-content: flex-end;
      }
      .nav-arrow {
        font-size: 1.6rem;
        color: #007acc;
        text-decoration: none;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.2em 0;
        transition: background 0.2s;
      }
      .nav-arrow[aria-disabled="true"] {
        color: #bbb;
        cursor: not-allowed;
        opacity: 0.5;
        pointer-events: none;
        background: none;
      }

      .nav-arrow:focus {
        outline: 2px solid #007acc;
        outline-offset: 2px;
      }
      .nav-arrow[aria-disabled="true"]:focus {
        outline: none;
      }
      h1 {
        text-align: left;
        margin-top: 0;
      }
      .site-link {
        color: #000;
        text-decoration: none;
        font-weight: bold;
      }
      .gauge {
        display: block;
        margin: 0 auto;
      }
      /* Layout and component styles */
      header {
        display: flex;
        flex-shrink: 0;
        justify-content: space-between;
        padding-bottom: 1rem;
        margin-bottom: 0;
      }
      .score-cell {
        padding: 0;
        vertical-align: top;
        min-width: 500px;
      }
      .history-cell {
        padding: 8px;
        vertical-align: top;
        text-align: center;
        background: #fafafa;
        min-width: 220px;
      }
      .score-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        align-items: start;
      }
      .score-expander {
        display: grid;
        grid-template-rows: 0fr;
        overflow: hidden;
        transition: grid-template-rows 100ms ease-in-out;
      }
      tr[aria-expanded="true"] .score-expander {
        grid-template-rows: 1fr;
      }
      .score-expander-content {
        min-height: 0;
        transition: visibility 100ms ease-in-out;
        visibility: hidden;
      }
      tr[aria-expanded="true"] .score-expander-content {
        visibility: visible;
      }
      .score-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 8px;
        min-width: 0;
        word-break: break-word;
      }
      .score-label {
        font-size: 12px;
        margin-bottom: 8px;
        text-align: center;
        color: #485b68;
      }
      .score-gauge {
        margin-bottom: 24px;
      }
      .score-summary {
        font-size: 12px;
        margin-bottom: 8px;
        width: 100%;
      }
      .score-screenshot {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      /* Show summary only when row is expanded */
      .score-summary .issue-summary {
        display: none;
      }
      tr[aria-expanded="true"] .score-summary .issue-summary {
        display: block !important;
      }
      @media (max-width: 900px) {
        .container {
          padding: 1rem 0.5rem;
        }
      }
      @media (max-width: 600px) {
        .container {
          padding: 0.5rem 0.2rem;
        }
        .audit-meta {
          position: static;
          display: block;
          margin-bottom: 0.5em;
          text-align: left;
        }
        .score-grid {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
        .score-col {
          padding: 12px 4px;
        }
      }
    </style>
    {{head}}
  </head>
  <body>
    {{body}}
  </body>
</html>
